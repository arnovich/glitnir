<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Glitnir</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;1,8..60,400&display=swap">
<link rel="stylesheet" href="/katex/katex.min.css">
<link rel="stylesheet" href="/app.css">
<link rel="stylesheet" href="/cards.css">
<link rel="stylesheet" href="/circuits.css">
</head>
<body>
<div class="app">
  <header class="bar">
    <div class="brand"><span class="mark">∀</span>
      <nav class="crumbs" aria-label="Location"><span>Glitnir</span><span class="sep">/</span><span class="context-help file-context"><button type="button" class="file help-icon" id="file-name" data-help-key="file-path-tooltip" aria-describedby="file-path-tooltip">…</button><span class="help-tooltip" id="file-path-tooltip" role="tooltip" hidden></span></span></nav>
    </div>
    <div class="seg view-switcher" role="group" aria-label="View">
      <button type="button" data-mode="doc" aria-pressed="true">Notebook</button>
      <button type="button" data-mode="source" aria-pressed="false">Source</button>
      <button type="button" data-mode="graph" aria-pressed="false">Explore</button>
    </div>
    <div class="bar-right">

      <details id="notebook-view-options" class="notebook-view-options">
        <summary><span aria-hidden="true">⋯</span> More <span class="dropdown-chevron" aria-hidden="true">⌄</span></summary>
        <div class="view-options-panel">
          <details class="history" id="history">
            <summary><svg class="ic"><use href="#i-history"/></svg>History <span class="dropdown-chevron" aria-hidden="true">⌄</span></summary>
            <div class="history-panel" id="history-panel">
              <section id="git-history" hidden></section>
              <section id="notebook-activity"></section>
            </div>
          </details>
          <button type="button" id="export-html">Export HTML</button>
          <div class="notebook-preferences">
            <div class="menu-label">Notebook</div>
            <label class="live-follow-control"><input type="checkbox" id="live-follow"> Follow live edits</label>
            <p>Scroll to changed sections after saving.</p>
          </div>
        </div>
      </details>
      <button type="button" class="secondary" id="panel-show" hidden><svg class="ic"><use href="#i-panel"/></svg>Inspector</button>
      <button type="button" class="secondary" id="keys-open" aria-label="Keyboard shortcuts"><kbd>?</kbd></button>
    </div>
    <div class="header-status-row">
      <details class="header-status" id="header-status">
        <summary id="status-summary" aria-label="Notebook status and details">
          <span class="connection-status"><span class="conn" id="conn" aria-hidden="true"></span><span id="conn-text" role="status">Connecting…</span></span>
          <span id="proof-availability" hidden></span>
          <span class="subline" id="subline"></span>
          <span id="live-status" role="status" hidden></span>
          <span class="status-info" aria-hidden="true">ⓘ</span>
        </summary>
        <div class="status-details">
          <p id="connection-detail">Connecting to the local notebook server…</p>
          <p id="file-state"></p>
          <p id="project-context"></p>
          <div id="lean-unsupported" data-tone="amber" hidden><p id="lean-unsupported-text"></p></div>
          <p id="preview-footer">Statuses describe saved files checked by sandboxed Lean.</p>
        </div>
      </details>
      <div id="run-activity" hidden><div id="proof-run-activity"></div><div id="shared-lean-activity" aria-hidden="true"></div></div>
      <span id="shared-lean-announcement" role="status"></span>
    </div>
  </header>

  <nav class="notebook-trail" id="notebook-trail" aria-label="Notebooks read in this panel" hidden></nav>

  <div class="heading">
    <div class="location" id="location" hidden></div>
    <div class="heading-row">
      <h1 id="title">Loading…</h1>
      <nav id="explore-tabs" class="seg explore-tabs" aria-label="Explore views" hidden>
        <button type="button" data-act="explore-graph" aria-pressed="true">Claim graph</button>
        <button type="button" data-act="explore-derivation" aria-pressed="false">Derivation</button>
        <button type="button" data-act="explore-hoare" aria-pressed="false" hidden>Hoare proof</button>
      </nav>
    </div>
  </div>

  <div class="live-bar" aria-label="Review navigation" hidden></div>

  <div class="workspace" id="workspace">
    <nav class="rail" aria-label="Notebook outline">
      <div class="contents-heading">
        <h4 class="label">Contents</h4>
        <span id="claim-graph-shortcut" hidden></span>
      </div>
      <ol id="outline"></ol>
    </nav>

    <div id="outline-resize" role="separator" tabindex="0" aria-label="Notebook sidebar width" aria-orientation="vertical" aria-controls="outline" aria-valuemin="200" aria-valuemax="480" aria-valuenow="260" title="Drag to resize; arrow keys adjust; double-click to reset"></div>
    <main class="document">
      <div class="doc-inner" id="reading-view">
        <div id="claim-graph-mobile" hidden><button type="button" class="secondary" data-act="open-claim-graph">View claim graph</button></div>
        <div class="chips-row" id="chips-row" aria-label="Claims"></div>
        <div class="banner" id="banner" hidden><svg class="ic"><use href="#i-branch"/></svg><span id="banner-text"></span><button type="button" id="check-project" hidden title="Check the saved Lean file from start to end">Check saved file</button><button type="button" id="inspect-project" hidden title="Show the Lean toolchain and local dependencies for this file">Show project setup</button></div>
        <div class="banner info" id="project-inspection" role="status" hidden></div>
        <section id="project-check" aria-label="Last checked snapshot" hidden></section>
        <div class="banner error" id="load-error" hidden></div>
        <div id="doc"></div>
        <div id="source" hidden></div>
      </div>
      <div id="graph-view" hidden></div>
    </main>

    <aside class="inspector" aria-label="Claim inspector">
      <div class="insp-head">
        <span class="avatar">F</span>
        <div class="who"><b id="insp-title"></b><span class="small muted" id="insp-sub"></span></div>
        <button type="button" class="ghost" id="panel-hide" aria-label="Hide inspector"><svg class="ic"><use href="#i-x"/></svg></button>
      </div>
      <div class="insp-scroll" id="insp" aria-live="polite"></div>
    </aside>
  </div>

</div>

<div class="overlay" id="keys" hidden>
  <div class="dialog keys-dialog" role="dialog" aria-modal="true" aria-labelledby="keys-title" aria-describedby="keys-intro">
    <h3 id="keys-title">Keyboard shortcuts</h3>
    <p class="keys-intro" id="keys-intro"></p>
    <div class="keys-groups" id="keys-groups"></div>
    <div class="keys-foot" id="keys-foot"><button type="button" class="secondary" id="keys-close">Close</button></div>
  </div>
</div>

<svg width="0" height="0" class="defs" aria-hidden="true">
  <symbol id="i-history" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/></symbol>
  <symbol id="i-branch" viewBox="0 0 24 24"><circle cx="6" cy="6" r="2.5"/><circle cx="6" cy="18" r="2.5"/><circle cx="18" cy="8" r="2.5"/><path d="M6 8.5v7M18 10.5c0 4-6 3-11.2 6"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></symbol>
  <symbol id="i-replay" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></symbol>
  <symbol id="i-panel" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M15 4v16"/></symbol>
  <symbol id="i-spark" viewBox="0 0 24 24"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/></symbol>
  <symbol id="i-edit" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16z"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
</svg>
<script src="/katex/katex.min.js"></script>
<script src="/export.js"></script>
<script src="/circuits.js"></script>
<script src="/cards.js"></script>
<!-- host scripts -->
<script src="/workbench.js"></script>
<script src="/figures.js"></script>
<script src="/reading.js"></script>
<script src="/research.js"></script>
<script src="/inspector.js"></script>
<script src="/atlas.js"></script>
<script src="/graph.js"></script>
<script src="/derivation.js"></script>
<script src="/chrome.js"></script>
</body>
</html>
