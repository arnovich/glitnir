name: Glitnir
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # Both test jobs install these exact wheels, and the extension job retains
      # the backend and plugin ones for a candidate, so a retry of any job in this
      # run tests the same bytes rather than a rebuild.
      - name: Reuse this run's wheels when retrying
        id: wheels
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          counts=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=glitnir-wheels" \
            --jq '[([.artifacts[] | select(.expired | not)] | length), ([.artifacts[] | select(.expired)] | length)] | @tsv')
          read -r kept expired <<< "$counts"
          if [ "$expired" != 0 ]; then
            echo "::error::This run's wheels have expired; start a new run instead of retrying it."
            exit 1
          fi
          echo "exists=$([ "$kept" != 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: astral-sh/setup-uv@v4
        if: steps.wheels.outputs.exists != 'true'
      - name: Build the backend and plugin wheels
        if: steps.wheels.outputs.exists != 'true'
        run: |
          uv build backend --wheel --out-dir backend/dist
          uv build plugins/forseti --wheel --out-dir plugins/forseti/dist
      - name: Share the wheels with both test jobs
        if: steps.wheels.outputs.exists != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: glitnir-wheels
          path: |
            backend/dist/*.whl
            plugins/forseti/dist/*.whl
          if-no-files-found: error
          retention-days: 7
  extension:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: astral-sh/setup-uv@v4
      - name: Retrieve this run's wheels
        uses: actions/download-artifact@v4
        with:
          name: glitnir-wheels
      - name: Install runtime and extension dependencies
        run: |
          uv venv --python 3.12 .venv
          uv pip install --python .venv/bin/python -c backend/requirements-dev.lock 'backend/dist/glitnir-0.1.9-py3-none-any.whl[dev]'
          # glitnir is not on an index, so the plugin's own dependencies are named here.
          uv pip install --python .venv/bin/python -c backend/requirements-dev.lock lark z3-solver
          uv pip install --python .venv/bin/python --no-deps plugins/forseti/dist/glitnir_forseti-0.1.9-py3-none-any.whl
          uv venv --python 3.12 .venv-core
          uv pip install --python .venv-core/bin/python -c backend/requirements-dev.lock \
            backend/dist/glitnir-0.1.9-py3-none-any.whl
          npm ci
          npm audit --audit-level=high
          echo "GLITNIR_BUILD_PYTHON=$GITHUB_WORKSPACE/.venv/bin/python" >> "$GITHUB_ENV"
      - name: Prepare the sandbox and a display for the host test
        run: |
          sudo apt-get update -qq
          sudo apt-get install --yes bubblewrap apparmor apparmor-profiles xvfb
          sudo apparmor_parser -r /usr/share/apparmor/extra-profiles/bwrap-userns-restrict
          .venv/bin/python -c 'from glitnir.lean.sandbox import sandbox_available; assert sandbox_available(), "Linux CI requires a working bubblewrap sandbox"'
      - name: Check owned backend
        working-directory: backend
        run: |
          # The live job runs the rest: every test_live_ test (marked live).
          ../.venv/bin/python -m pytest -m "not live" --cov --cov-report=term-missing
          ../.venv/bin/black --check src tests scripts experiments
          ../.venv/bin/isort --check-only src tests scripts experiments
          ../.venv/bin/flake8 src tests scripts experiments
          ../.venv/bin/mypy src scripts experiments
      - name: Check the Forseti extension package
        working-directory: plugins/forseti
        run: |
          # Tests needing the audited Forseti release skip unless FORSETI_LEAN_PROJECT is set.
          ../../.venv/bin/python -m pytest -q
          ../../.venv/bin/black --check src tests tools
          ../../.venv/bin/isort --check-only src tests tools
          ../../.venv/bin/flake8 src tests tools
          ../../.venv/bin/mypy src
      - run: npm test
      - name: Check minimal runtime HTTP bridge
        run: GLITNIR_BUILD_PYTHON="$PWD/.venv-core/bin/python" node --test extension/test/installed-backend.test.cjs
      - name: Package the version-tagged extension
        run: GLITNIR_BACKEND_RELEASE_TAG="v$(node -p 'require("./package.json").version')" npm run package
      - name: Verify fresh setup with the packaged extension
        run: |
          mkdir -p "$HOME/.local/bin"
          if [ ! -x "$HOME/.local/bin/uv" ]; then
            ln -s "$(command -v uv)" "$HOME/.local/bin/uv"
          fi
          version=$(node -p 'require("./package.json").version')
          unzip -q "glitnir-$version.vsix" -d "$RUNNER_TEMP/checked-vsix"
          python=$(node extension/scripts/check-thin-install.cjs "$RUNNER_TEMP/checked-vsix/extension" backend/dist/glitnir-0.1.9-py3-none-any.whl "$RUNNER_TEMP/checked-backends")
          echo "GLITNIR_TEST_PYTHON=$python" >> "$GITHUB_ENV"
          echo "GLITNIR_TEST_VSIX=$PWD/glitnir-$version.vsix" >> "$GITHUB_ENV"
      - name: Check the installed extension in an isolated VS Code host
        run: xvfb-run -a npm run test:host
      - name: Preserve the originally tested wheel when retrying this run
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: backend-artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: node extension/scripts/release-candidate.cjs artifact glitnir-tested-backend
      - name: Retain the tested backend for this main candidate
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.backend-artifact.outputs.exists != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: glitnir-tested-backend
          path: backend/dist/*.whl
          if-no-files-found: error
          retention-days: 7
      - name: Preserve the originally tested plugin wheel when retrying this run
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: plugin-artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: node extension/scripts/release-candidate.cjs artifact glitnir-tested-plugin
      - name: Retain the tested plugin wheel for this main candidate
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.plugin-artifact.outputs.exists != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: glitnir-tested-plugin
          path: plugins/forseti/dist/*.whl
          if-no-files-found: error
          retention-days: 7
      - name: Preserve the originally tested VSIX when retrying this run
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: vsix-artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: node extension/scripts/release-candidate.cjs artifact glitnir-tested-vsix
      - name: Retain the tested extension for release verification
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.vsix-artifact.outputs.exists != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: glitnir-tested-vsix
          path: glitnir-*.vsix
          if-no-files-found: error
          retention-days: 7
  live:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v4
      - name: Retrieve this run's wheels
        uses: actions/download-artifact@v4
        with:
          name: glitnir-wheels
      - name: Install the backend as the extension job does
        run: |
          uv venv --python 3.12 .venv
          uv pip install --python .venv/bin/python -c backend/requirements-dev.lock 'backend/dist/glitnir-0.1.9-py3-none-any.whl[dev]'
          uv pip install --python .venv/bin/python -c backend/requirements-dev.lock lark z3-solver
          uv pip install --python .venv/bin/python --no-deps plugins/forseti/dist/glitnir_forseti-0.1.9-py3-none-any.whl
      - name: Install Lean and the sandbox
        run: |
          sudo apt-get update -qq
          sudo apt-get install --yes bubblewrap apparmor apparmor-profiles elan
          sudo apparmor_parser -r /usr/share/apparmor/extra-profiles/bwrap-userns-restrict
          .venv/bin/python -c 'from glitnir.lean.sandbox import sandbox_available; assert sandbox_available(), "Linux CI requires a working bubblewrap sandbox"'
          # The one Lean version Glitnir checks, from project_inspection.TOOLCHAIN.
          elan toolchain install "$(.venv/bin/python -c 'from glitnir.lean.project_inspection import TOOLCHAIN; print(TOOLCHAIN)')"
      - name: Bound the experimental native-test store for this toolchain
        run: |
          .venv/bin/python - <<'PYCODE'
          import os
          import shutil
          from glitnir.lean.project_inspection import _toolchain
          # Same trusted input filter as project_snapshot.capture/preflight.
          needed = sum(p.stat().st_size for p in (_toolchain() / "lib").rglob("*")
                       if p.is_file() and p.suffix not in {".a", ".ilean", ".tbd"})
          allowance = max(3 * 1024**3, needed + 1024**3)
          assert allowance <= 16 * 1024**3, "Experimental CI store exceeds ceiling"
          assert shutil.disk_usage(".").free > allowance + 1024**3
          with open(os.environ["GITHUB_ENV"], "a") as output:
              output.write(f"GLITNIR_WARM_TEST_DISK_BYTES={allowance}\n")
          PYCODE
      - name: Check handoff builds inside an aggregate resource boundary
        working-directory: backend
        run: |
          sudo systemd-run --quiet --wait --pipe --collect \
            --property=User="$(id -un)" --property=WorkingDirectory="$PWD" \
            --property=MemoryMax=4G --property=MemorySwapMax=0 --property=TasksMax=128 \
            /usr/bin/env HOME="$HOME" PATH="$PATH" \
            GLITNIR_REQUIRE_PROJECT_INSPECTION=1 GLITNIR_TEST_PROOF_TRACE=1 \
            "$PWD/../.venv/bin/python" -m pytest -m 'live and handoff_build' -rs --durations=30
      - name: Check the backend against live Lean
        working-directory: backend
        env:
          # Under these, a live test missing Lean or the sandbox fails, and one
          # that skips for any other reason fails too (tests/conftest.py).
          GLITNIR_REQUIRE_PROJECT_INSPECTION: '1'
          GLITNIR_TEST_PROOF_TRACE: '1'
        run: ../.venv/bin/python -m pytest -m 'live and not handoff_build' -rs --durations=30
  helpers:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v4
      - name: Retrieve this run's wheels
        uses: actions/download-artifact@v4
        with:
          name: glitnir-wheels
      - name: Install the backend and Lean
        run: |
          uv venv --python 3.12 .venv
          uv pip install --python .venv/bin/python -c backend/requirements-dev.lock backend/dist/glitnir-0.1.9-py3-none-any.whl
          sudo apt-get update -qq
          sudo apt-get install --yes elan
          elan toolchain install "$(.venv/bin/python -c 'from glitnir.lean.project_inspection import TOOLCHAIN; print(TOOLCHAIN)')"
      # Every helper program, composed as a check composes it, elaborates on the
      # supported Lean with no output: a warning on standard output breaks the
      # JSON Glitnir reads from it.
      - name: Elaborate the Lean helper programs
        run: .venv/bin/python backend/scripts/check_helpers.py
      - name: Elaborate the offline experimental helper
        working-directory: backend
        run: |
          ../.venv/bin/python - <<'PY'
          from scripts.check_helpers import elaborate
          from experiments.warm_pool.environment import PROGRAM
          from glitnir.lean.project_inspection import _toolchain
          status, output = elaborate(PROGRAM, _toolchain(), lake=False)
          assert status == 0 and not output, output
          PY
  # The plugin-live shards, from plugins/forseti/tools/live_shards.py, so the
  # matrix always covers the whole suite exactly once.
  plugin-live-shards:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      names: ${{ steps.shards.outputs.names }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: List the shards
        id: shards
        run: echo "names=$(python3 plugins/forseti/tools/live_shards.py --names)" >> "$GITHUB_OUTPUT"
  # The plugin's Lean tests, against the Forseti Lean release the plugin pins,
  # in shards that each build that release.
  plugin-live:
    needs: [build, plugin-live-shards]
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plugin-live-shards.outputs.names) }}
    name: plugin-live (${{ matrix.shard }})
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v4
      - name: Retrieve this run's wheels
        uses: actions/download-artifact@v4
        with:
          name: glitnir-wheels
      - name: Install the backend and plugin as the extension job does
        run: |
          uv venv --python 3.12 .venv
          uv pip install --python .venv/bin/python -c backend/requirements-dev.lock 'backend/dist/glitnir-0.1.9-py3-none-any.whl[dev]'
          uv pip install --python .venv/bin/python -c backend/requirements-dev.lock lark z3-solver
          uv pip install --python .venv/bin/python --no-deps plugins/forseti/dist/glitnir_forseti-0.1.9-py3-none-any.whl
      - name: Install elan and the sandbox
        run: |
          curl -fsSL https://github.com/leanprover/elan/releases/download/v4.2.4/elan-x86_64-unknown-linux-gnu.tar.gz -o "$RUNNER_TEMP/elan.tar.gz"
          echo "42b94d4244e8353142c456ec0e4ca6528fd898a6c604d4059f494e706e431f63  $RUNNER_TEMP/elan.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/elan.tar.gz" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/elan-init" -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          sudo apt-get update -qq
          # keyutils: a sandbox probe checks that a proof cannot read the session keyring.
          sudo apt-get install --yes bubblewrap apparmor apparmor-profiles keyutils
          sudo apparmor_parser -r /usr/share/apparmor/extra-profiles/bwrap-userns-restrict
          .venv/bin/python -c 'from glitnir.lean.sandbox import sandbox_available; assert sandbox_available(), "Linux CI requires a working bubblewrap sandbox"'
      # The release the plugin pins (lean-release.v1.json); its build brings the
      # supported Lean toolchain with it.
      - name: Build the pinned Forseti Lean release
        run: |
          git clone --quiet --depth 1 --branch v0.5.1 https://github.com/arnovich/forseti-lean.git "$RUNNER_TEMP/forseti-lean"
          cd "$RUNNER_TEMP/forseti-lean"
          test "$(git rev-parse HEAD)" = 36304c70fd2372fc1aa9b1e74643d0d0a516de3a
          lake exe cache get
          lake build
          # Views and evidence load their providers' modules from the project's
          # build, as a user's project must have built them; the release's own
          # targets do not include them all.
          modules=$("$GITHUB_WORKSPACE/.venv/bin/python" -c 'from glitnir_forseti import providers; print(" ".join(sorted({m for p in providers() for m in p.imports if m.startswith("Gimle.")})))')
          lake build $modules
      - name: Check the plugin against live Lean (${{ matrix.shard }})
        working-directory: plugins/forseti
        env:
          # Under the gate a Lean test that cannot run, or skips, fails
          # (tests/conftest.py). No test runs the community REPL.
          FORSETI_REQUIRE_LEAN_PROJECT: '1'
          # A cold first check replays Mathlib and Forseti; let a waiting check
          # outlast it (the editor's timeout setting, at its cap).
          GLITNIR_ELABORATION_TIMEOUT_MS: '1800000'
          SHARD: ${{ matrix.shard }}
        run: |
          export FORSETI_LEAN_PROJECT="$RUNNER_TEMP/forseti-lean"
          # A failing assignment stops the step; it never runs an empty list.
          list=$(python3 tools/live_shards.py "$SHARD")
          mapfile -t modules <<< "$list"
          # Each test's name, outcome and time as it finishes, so a shard that
          # runs out of time still says what it ran.
          ../../.venv/bin/python -m pytest -v --tb=short -rfE --durations=50 \
            -o console_output_style=times "${modules[@]}"
  candidate:
    needs: [extension, live, helpers, plugin-live]
    # Release candidates are created only once RELEASE_CANDIDATES is set to true.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.RELEASE_CANDIDATES == 'true'
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/candidate.yml
